<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Python Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .box { width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .message { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Login Page</h2>
        <!-- The form uses POST method to talk back to Python -->
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required>
            
            <label>Password:</label>
            <input type="password" name="password" required>
            
            <button type="submit">Log In</button>
        </form>

        <!-- Python injects feedback message here -->
        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}
    </div>

</body>
</html>
